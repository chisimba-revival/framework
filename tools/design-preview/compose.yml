name: chisimba-ltb-design
services:
  web:
    image: chisimba-php85-web
    restart: unless-stopped
    volumes:
      - ${PREVIEW_ROOT}/app:/var/www/html/ch:ro
      - ${PREVIEW_ROOT}/app/config:/var/www/html/ch/config
      - ${PREVIEW_ROOT}/app/usrfiles:/var/www/html/ch/usrfiles
      - ${PREVIEW_ROOT}/app/error_log:/var/www/html/ch/error_log
      - ${PREVIEW_ROOT}/app/error_logs:/var/www/html/ch/error_logs
      - ${PREVIEW_ROOT}/filemanager:/var/data/filemanager
      - ./preview.ini:/usr/local/etc/php/conf.d/zzz-preview.ini:ro
    networks: [isolated]
    depends_on: [db]
  db:
    image: mariadb:10.11.18
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: preview-root-local
      MARIADB_DATABASE: chisimba_ltb_preview
    volumes:
      - preview_db:/var/lib/mysql
    networks: [isolated]
  proxy:
    image: nginx:1.31.3-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:8446:443']
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${PREVIEW_CERTS}:/etc/nginx/certs:ro
    networks: [isolated, frontend]
    depends_on: [web]
networks:
  isolated:
    internal: true
  frontend: {}
volumes:
  preview_db: {}
