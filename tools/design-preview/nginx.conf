events {}
http {
    server {
        listen 443 ssl;
        server_name chisimba.test;
        ssl_certificate /etc/nginx/certs/chisimba.test.crt;
        ssl_certificate_key /etc/nginx/certs/chisimba.test.key;
        client_max_body_size 64m;
        location / {
            proxy_pass http://web:80;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8446;
        }
    }
}
