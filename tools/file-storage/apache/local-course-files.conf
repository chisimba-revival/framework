# Local PHP 8.5 site only. Adapt the filesystem root and /ch prefix together for
# each deployment; every alias to this storage must receive the same protection.
<Directory /var/www/html/ch/usrfiles>
    Options -Indexes
    RewriteEngine On
    RewriteRule ^\.migration- - [F,L]
    RewriteRule ^(context/.*)$ /ch/index.php?module=filemanager&action=coursefile&path=$1 [B,L]
    RewriteRule ^((?:filemanager_thumbnails|filemanager_forcemax)/.*)$ /ch/index.php?module=filemanager&action=filederivative&path=$1 [B,L]
    # Submission bytes must only be served by Assignment's guarded route.
    RewriteRule ^assignment(?:/|$) - [F,L]
    # Upload replacement files are never intended as a public asset endpoint.
    RewriteRule ^filemanager_tempfiles(?:/|$) - [F,L]
</Directory>
