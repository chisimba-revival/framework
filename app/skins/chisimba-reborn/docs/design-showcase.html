<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chisimba design workshop</title>
<style>*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui;background:#e7e9e8;color:#253535}header{padding:20px 24px;background:#fff;border-bottom:1px solid #becac6}h1{font-size:20px;margin:0}p{margin:6px 0 16px;max-width:85ch}.controls{display:flex;gap:16px;flex-wrap:wrap}label{display:grid;gap:5px;font-weight:600}select{font:inherit;padding:9px;border:1px solid #80928b;border-radius:5px;background:white}a{color:#245b50}#stage{overflow:auto;padding:24px;max-width:100%}iframe{display:block;border:0;margin:auto;background:white;width:100%;height:1100px;box-shadow:0 6px 28px #25353520}select:focus-visible,a:focus-visible{outline:3px solid #245b50;outline-offset:3px}</style>
<header><h1>Chisimba design workshop</h1><p>Shared components, distinct canvases. Sample content only: forms do not change accounts or publish content. Fixed widths preview the available layout space; use a real device for touch and browser testing.</p><div class="controls"><label>Canvas<select id="canvas"><option value="learn-the-birds">Learn-the-Birds · editorial</option><option value="kenga-solutions">KengaSolutions · professional</option><option value="_default">Chisimba · default</option></select></label><label>Viewport width<select id="width"><option value="100%">Available width</option><option value="320px">320 · small phone</option><option value="390px">390 · phone</option><option value="768px">768 · tablet</option><option value="1280px">1280 · desktop</option></select></label><label>Example<select id="screen"><option value="public">Public page</option><option value="people">User form</option><option value="editor">Post editor</option></select></label></div></header><div id="stage"><iframe id="preview" title="Live component preview" src="design-specimen.html"></iframe></div>
<script>const frame=document.querySelector('iframe');function update(){frame.style.width=document.querySelector('#width').value;frame.src='design-specimen.html?'+new URLSearchParams({canvas:document.querySelector('#canvas').value,screen:document.querySelector('#screen').value});}document.querySelector('#width').addEventListener('change',e=>{frame.style.width=e.target.value;});document.querySelector('#canvas').addEventListener('change',update);document.querySelector('#screen').addEventListener('change',update);</script></html>
