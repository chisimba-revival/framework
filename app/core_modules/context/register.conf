MODULE_ID: context
MODULE_ICON: book-open
MODULE_NAME: Context
MODULE_DESCRIPTION: The environment in which a group of related applications and tools are housed. This environment manages the abstraction of users, plugins and modules. It forms the basis for other modules. This module will be used in the context of the system configuration hence the name.
MODULE_AUTHORS: Wesley Nitsckie, Tohir Solomons, David wafula, Paul Mungai
MODULE_RELEASEDATE: 2026 08 29
MODULE_VERSION: 2.041
UPDATE_DESCRIPTION: Put unfinished due assessments on the learner class start page.
UPDATE_DESCRIPTION: Retire legacy public context listing blocks in favour of maintained discovery pages.
UPDATE_DESCRIPTION: Apply sentence case and system terminology throughout the context administration task panel.
UPDATE_DESCRIPTION: Preserve configured class terminology on the context home journey and sidebar.
UPDATE_DESCRIPTION: Preserve configurable class terminology throughout My Learning.
UPDATE_DESCRIPTION: Restore configurable author terminology in course-management labels.
UPDATE_DESCRIPTION: Route course activity deep links through one membership-aware, scope-safe launch journey.
UPDATE_DESCRIPTION: Enrol admitted free and tier-course learners in the canonical course Students group before entry.
UPDATE_DESCRIPTION: Identify Edit Settings correctly in the course sidebar instead of labelling it Course Home.
UPDATE_DESCRIPTION: Restore distinct single-page settings and full course wizard journeys, align their core settings, and make the home journey role-aware.
UPDATE_DESCRIPTION: Allow lecturers to change course format from the normal course settings page without repeating the creation wizard.
UPDATE_DESCRIPTION: Add Masterclass as a validated course format and identify it consistently in the course catalogue.
UPDATE_DESCRIPTION: Keep the course-image replacement preview compact so settings retain their working width.
UPDATE_DESCRIPTION: Correct the course-settings layout by replacing its legacy outer table with a responsive content grid.
UPDATE_DESCRIPTION: Modernise course settings and persist admission policy only for separately paid courses.
UPDATE_DESCRIPTION: Put the price or required membership directly on each gated course action.
UPDATE_DESCRIPTION: Turn gated course cards into clear priced membership, purchase or admission actions.
UPDATE_DESCRIPTION: Put course pricing and sales in the course-administration journey when payment support is installed.
UPDATE_DESCRIPTION: Give gated learners a direct registration, sign-in or course-purchase next step.
