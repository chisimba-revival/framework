UPDATE_DESCRIPTION: [pwando] Added a delete button on step 3
UPDATE_DESCRIPTION: [pwando] Step 3 picks old goals/outcomes and adds them to the new table automatically
UPDATE_DESCRIPTION: [pwando] Changed step 3 of context admin to allow more than one distinct Learning outcome to be added. Also added new language items
UPDATE_DESCRIPTION: [davidwaf] added configrable email alert when new content is added
UPDATE_DESCRIPTION: [pwando] Added a configurable option on step 1. User has option to show or hide comments on course page view
