MODULE_ID: contextadmin
MODULE_ICON: user-cog
MODULE_NAME: ContextAdmin
MODULE_DESCRIPTION: This module controls the way the context modules will be be configured. It has the ability to create, edit and delete context's. It also controlls the which plugins/modules will be used by a specific context.

MODULE_AUTHORS: Tohir Solomons, Paul Mungai
MODULE_RELEASEDATE: 2026 08 29
MODULE_VERSION: 1.435
UPDATE_DESCRIPTION: Fix the module namespace used to resolve Microlearning and Masterclass format help during creation and editing.
UPDATE_DESCRIPTION: Complete the active-journey terminology audit and preserve configured role and context names.
UPDATE_DESCRIPTION: Restored system-text terminology throughout the [-context-] creation journey.
UPDATE_DESCRIPTION: Added the opt-in [-section-] setting to [-context-] creation and editing.
UPDATE_DESCRIPTION: Replace the legacy course-administration sidebar with task navigation and return lecturer management to the Course Control Panel.
UPDATE_DESCRIPTION: Offer Masterclass as a clearly defined course format during course creation and editing.
UPDATE_DESCRIPTION: Simplify course access, status and conditional admission controls across create and edit.
UPDATE_DESCRIPTION: Route Course Admin to the active course administration workspace while retaining the course list at root scope.
UPDATE_DESCRIPTION: Return lecturer and ownership management to Manage Course Members instead of the course editor.
UPDATE_DESCRIPTION: Label the scoped current-course destination as Course settings.
UPDATE_DESCRIPTION: Fix author action URLs and clarify the two-step ownership transfer workflow.
UPDATE_DESCRIPTION: Use curated UI icons for course ownership transfer and author removal.
UPDATE_DESCRIPTION: Treat ContextAdmin as an author-facing workspace rather than an admin-only module so site [-authors-] can see its User-menu entry; admin-only pages remain separately registered.
UPDATE_DESCRIPTION: Place author-facing course management in the User menu so canonical site [-authors-] can discover course management and creation.
UPDATE_DESCRIPTION: Expose course management and course creation pages to canonical site [-authors-] while retaining backend authorization checks.
UPDATE_DESCRIPTION: Restore canonical site-author course creation, contextual multi-author management, ownership transfer and owner-only destructive administration.
UPDATE_DESCRIPTION: Added Learning Journey as the first default middle block for newly created [-contexts-]
