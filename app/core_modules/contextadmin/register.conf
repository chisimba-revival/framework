UPDATE_DESCRIPTION: [pwando] Context Admin can now save alerts
UPDATE_DESCRIPTION: [pwando] Improved the selection of outcomes on step 3. No need for clicking button to add fields
UPDATE_DESCRIPTION: [pwando] Changed step 3 for learner outcomes. Changed textarea to htmlarea
