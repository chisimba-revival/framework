TEXT: mod_contextadmin_delete_help|Deletion help|Only the owner or a site administrator can delete a [-context-]. Confirm the title and code before continuing. Its groups, conversation messages and course-only announcements are removed together. Announcements shared with other [-contexts-] are preserved. This cannot be undone here.
