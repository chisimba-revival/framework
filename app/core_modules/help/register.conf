MODULE_ID: help
MODULE_ICON: info
MODULE_NAME: Help
MODULE_DESCRIPTION: This service module is used to display help information about a module feature. Each action / page within the module can be linked to a section of help. It also presents the user with interactive demos (viewlets) where available, and can provide links to related help topics. The help icon is displayed on the toolbar.
MODULE_AUTHORS: Derek Keats, Tohir Solomons, Megan Watson
MODULE_RELEASEDATE: 2006 09 13
MODULE_VERSION: 0.308
UPDATE_DESCRIPTION: Open full contextual guidance beside the task instead of navigating away from it.
UPDATE_DESCRIPTION: Refine contextual guide presentation within the normal page layout.
UPDATE_DESCRIPTION: Name contextual guide routes in the normal breadcrumb trail.
UPDATE_DESCRIPTION: Add a permission-aware contextual help pattern with full guide support.
UPDATE_DESCRIPTION: Retire the unmaintained public Getting help block.
