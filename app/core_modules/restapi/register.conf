TEXT: mod_restapi_description|REST API module for Chisimba|Provides RESTful API endpoints with JWT authentication
# Rights for the REST API resources. Module registration reads this key and
# passes each action to PermissionService::ensureRight() for the area named
# after this module, so the rights exist for a fresh install instead of
# relying on scripts/configure-service.php having been run.
#
# These names are the ones RestController::requirePermission() asks for. The
# condition segment is what the legacy decision-table half of the registration
# path evaluated; the canonical PermissionService grant above is what is
# actually enforced, and it is granted per action rather than per condition.
# files.delete is declared for completeness even though no endpoint uses it
# yet: getFileInfo()/deleteFile() on dbFile take a bare file id with no
# ownership scoping, so exposing a delete endpoint would let any authenticated
# user delete any file. See README.md.
RULE: users.view,users.create,users.edit,users.delete,modules.view,modules.install,modules.uninstall,files.view,files.upload,files.delete|isAdmin
