TEXT: mod_postlogin_help_title|Site Home editing guide title|Arrange Site Home
TEXT: mod_postlogin_help_summary|Site Home editing scope|Only current site administrators can change this layout. Changes affect Site Home for everyone.
TEXT: mod_postlogin_help_edit|Enable editing|Select Turn Editing On to show block controls. Use Tab to reach controls and Enter or Space to activate buttons.
TEXT: mod_postlogin_help_add|Add block|Choose a block to preview it, then select Add Block. A successful addition reloads the page.
TEXT: mod_postlogin_help_move|Move block|Use Move block up or Move block down. Each successful change saves immediately.
TEXT: mod_postlogin_help_remove|Remove placement|Remove block asks for confirmation. Cancel or Escape keeps the block. Removing a placement does not delete its source content.
TEXT: mod_postlogin_help_recover|Recover from rejected writes|If the page reports a stale layout or interrupted save, reload before continuing. Do not repeat an uncertain save. A renewed security token keeps your selection so you can retry after a definite rejection.
