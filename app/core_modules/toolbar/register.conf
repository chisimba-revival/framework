MODULE_ID: toolbar
MODULE_ICON: monitor-cog
MODULE_NAME: Site Admin
MODULE_DESCRIPTION: The toolbar / Site Admin module provides the navigational elements - the main toolbar &trade; , side menu's and the Course Management and Site Admin pages. An interface to the toolbar provides management of the navigation links - adding, editing, removing and changing permissions on the links.

MODULE_AUTHORS: Megan Watson, Dean Van Niekerk, Paul Scott, David Wafula
MODULE_RELEASEDATE: 2006 10 17
MODULE_VERSION: 1.799
UPDATE_DESCRIPTION: Keep dashboard management actions with their Learning, Teaching and Administration journeys.
UPDATE_DESCRIPTION: Hide course-dependent toolbar and sidebar destinations until the course enables their modules.
UPDATE_DESCRIPTION: Declare the shared UI module required by toolbar and administration icons.
UPDATE_DESCRIPTION: Populate launch journeys with context-aware course tasks and visually separate the Logout account action.
UPDATE_DESCRIPTION: Replace legacy module categories with the bounded Learning, Teaching, Administration and Information launch journeys.
UPDATE_DESCRIPTION: Remove the redundant legacy Home entry from student-only account cards.
UPDATE_DESCRIPTION: Add explicit My Learning and Site Home routes for student-only accounts.
UPDATE_DESCRIPTION: Keep Admin and Assessment task menus out of student navigation while preserving direct learning-activity access.
UPDATE_DESCRIPTION: Let the administration workbench use the canvas width instead of reserving an empty Region 3 track.
MODULE_PATH: toolbar
MODULE_CATEGORY: core
UPDATE_DESCRIPTION: Allow individual menu, side-menu and administration-page links to override module-wide context dependency.
UPDATE_DESCRIPTION: Show the current course, personal or root scope in the standard Chisimba Reborn footer.
UPDATE_DESCRIPTION: Restore a true single-column canvas and use Home rather than a welcome message as the root breadcrumb.
UPDATE_DESCRIPTION: Make Module Catalogue replace module navigation through the canonical registrar so stale default links are removed.
UPDATE_DESCRIPTION: Apply the global scope footer and true one-column canvas to the Kenga Learn skin.
UPDATE_DESCRIPTION: Add a readable skin link primitive for links displayed on table surfaces.
UPDATE_DESCRIPTION: Renders toolbar icons from each module's registered MODULE_ICON metadata.
UPDATE_DESCRIPTION: Add a context-aware Leave [-context-] action to the post-login account card.
UPDATE_DESCRIPTION: Remove the redundant toolbar Home item and point standard breadcrumb Home links at the canonical site root.
MODULE_STATUS: stable
TAGS: system|core|administration|config|required|toolbar

DEPENDS: ui

